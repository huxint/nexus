name: CodSpeed Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@v5

      # The library needs GCC 16.2+ (C++26 + contracts), which the runner image
      # does not ship yet: the toolchain comes from conda-forge instead.
      - name: Install the GCC 16.2 toolchain
        env:
          MAMBA_ROOT_PREFIX: ${{ runner.temp }}/mamba
        run: |
          set -euo pipefail
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xj -C "$HOME" bin/micromamba
          "$HOME/bin/micromamba" create -y -p "$HOME/gcc16" -c conda-forge \
            gxx_linux-64=16.2.0 cmake ninja tbb-devel
          echo "$HOME/gcc16/bin" >> "$GITHUB_PATH"

      - name: Build the benchmarks
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER="$HOME/gcc16/bin/x86_64-conda-linux-gnu-gcc" \
            -DCMAKE_CXX_COMPILER="$HOME/gcc16/bin/x86_64-conda-linux-gnu-g++" \
            -DBUILD_CODSPEED_BENCH=ON \
            -DCODSPEED_MODE=simulation
          cmake --build build --target nexus_codspeed_bench -j

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: ./build/nexus_codspeed_bench
